<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eee;
        }

        .login-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            width: 95%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #message {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required><br>
        <input type="password" id="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <p>Don't have an account? <a href="register.html">Register here</a></p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    // Fata info user muri localStorage
    var savedEmail = localStorage.getItem("userEmail");
    var savedPassword = localStorage.getItem("userPassword");

    if(email === savedEmail && password === savedPassword){
        // Bika ko user winjiye
        localStorage.setItem("loggedIn", "true");
        window.location.href = "admin.html";
    } else {
        document.getElementById("message").innerHTML = "Wrong email or password";
    }
});
</script>

</body>
</html>
